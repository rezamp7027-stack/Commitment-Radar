name: Commitment Radar static contract

on:
  push:
    branches:
      - main
      - work/phase-4-quality-ui-20261016
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser-test dependency
        run: npm install --no-save playwright
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run isolated browser smoke test
        run: node --test tests/browser-smoke.test.mjs

  static-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static contract tests
        run: node --test tests/static-contract.test.mjs
