name: Verify Commitment Radar
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned browser-test dependency
        run: npm install --no-package-lock
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Run contract and browser smoke tests
        run: npm test
