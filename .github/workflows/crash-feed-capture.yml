name: Authorized Crash Feed Capture

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only; do not write candidates to Supabase"
        required: true
        type: boolean
        default: true
      max_messages:
        description: "Maximum WebSocket messages to inspect (1–500)"
        required: true
        type: number
        default: 100

permissions:
  contents: read

concurrency:
  group: authorized-crash-feed-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CRASH_WS_URL: ${{ secrets.CRASH_WS_URL }}
      CRASH_PROTOCOL: ${{ vars.CRASH_PROTOCOL || 'signalr_oncrash_candidate' }}
      WS_TIMEOUT_SECONDS: "15"
      MAX_MESSAGES: ${{ inputs.max_messages }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Validate required settings without printing values
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CRASH_WS_URL:-}" ]] || { echo "::error::Missing Actions secret CRASH_WS_URL"; exit 1; }
          [[ -n "${SUPABASE_URL:-}" ]] || { echo "::error::Missing Actions secret SUPABASE_URL"; exit 1; }
          if [[ "${{ inputs.dry_run }}" != "true" ]]; then
            [[ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]] || { echo "::error::Missing Actions secret SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          fi
          [[ "${MAX_MESSAGES}" =~ ^[0-9]+$ ]] && (( MAX_MESSAGES >= 1 && MAX_MESSAGES <= 500 )) || { echo "::error::max_messages must be 1..500"; exit 1; }
          [[ "${CRASH_PROTOCOL}" == "generic" || "${CRASH_PROTOCOL}" == "signalr_oncrash_candidate" ]] || { echo "::error::Unsupported CRASH_PROTOCOL"; exit 1; }
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Capture and preview only
        if: ${{ inputs.dry_run }}
        run: python -m crash_feed_inspector capture-sync --dry-run
      - name: Capture and sync unverified candidates
        if: ${{ !inputs.dry_run }}
        run: python -m crash_feed_inspector capture-sync
      - name: Remove local capture files
        if: always()
        shell: bash
        run: rm -f data/messages.jsonl data/rounds.csv
