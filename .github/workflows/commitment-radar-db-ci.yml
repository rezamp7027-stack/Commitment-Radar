name: Commitment Radar database contract

on:
  push:
    branches: ["main", "feature/commitment-radar"]
    paths:
      - "commitment-radar/**"
      - ".github/workflows/commitment-radar-db-ci.yml"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commitment_radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d commitment_radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: commitment_radar_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax-check real Supabase Auth integration harness
        run: node --check commitment-radar/supabase/tests/auth_rls_integration.mjs

      - name: Create Supabase-compatible auth roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY,
            email text UNIQUE
          );
          CREATE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $function$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $function$;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;
          GRANT EXECUTE ON FUNCTION auth.uid() TO anon, authenticated, service_role;
          SQL

      - name: Apply reconstructed baseline
        run: psql -v ON_ERROR_STOP=1 -f commitment-radar/supabase/migrations/20261015112619_commitment_radar_initial_schema.sql

      - name: Apply backend hardening
        run: psql -v ON_ERROR_STOP=1 -f commitment-radar/supabase/migrations/20261015120014_commitment_radar_backend_hardening.sql

      - name: Apply audit trigger hardening
        run: psql -v ON_ERROR_STOP=1 -f commitment-radar/supabase/migrations/20261018094039_commitment_radar_audit_trigger_hardening.sql

      - name: Verify schema and grants
        run: psql -v ON_ERROR_STOP=1 -f commitment-radar/supabase/tests/security_contract.sql

      - name: Verify tenant isolation, viewer write denial, and organization RPC
        run: psql -v ON_ERROR_STOP=1 -f commitment-radar/supabase/tests/rls_behavior.sql


  supabase-local-auth-integration:
    # Runs the actual Supabase Auth + PostgREST stack in disposable Docker containers.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        id: setup-supabase-cli
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Start isolated local Supabase stack
        run: supabase start --workdir commitment-radar

      - name: Apply project migrations to local database
        run: supabase db reset --workdir commitment-radar

      - name: Export local API credentials for the test process
        shell: bash
        run: |
          set -euo pipefail
          supabase status --workdir commitment-radar --output env > /tmp/commitment-radar-supabase.env
          set -a
          source /tmp/commitment-radar-supabase.env
          set +a
          {
            echo "SUPABASE_TEST_URL=$API_URL"
            echo "SUPABASE_TEST_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_TEST_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Run real Auth JWT and PostgREST RLS integration tests
        run: node commitment-radar/supabase/tests/auth_rls_integration.mjs

      - name: Stop isolated Supabase stack
        if: always() && steps.setup-supabase-cli.outcome == 'success'
        run: supabase stop --workdir commitment-radar

  supabase-auth-integration:
    # Enable only after repository secrets point to a dedicated disposable Supabase project.
    if: ${{ vars.ENABLE_SUPABASE_AUTH_INTEGRATION == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require disposable-project secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_TEST_URL"
          test -n "$SUPABASE_TEST_ANON_KEY"
          test -n "$SUPABASE_TEST_SERVICE_ROLE_KEY"
          case "$SUPABASE_TEST_URL" in
            *htfrixfcirgrhlmwtkjs*) echo "Refusing to run destructive test harness against the production Commitment Radar project"; exit 1 ;;
          esac

      - name: Run real Auth JWT and PostgREST RLS integration tests
        run: node commitment-radar/supabase/tests/auth_rls_integration.mjs
