name: Commitment Radar database contract

on:
  push:
    branches: ["feature/commitment-radar"]
    paths:
      - "commitment-radar/**"
      - ".github/workflows/commitment-radar-db-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "commitment-radar/**"
      - ".github/workflows/commitment-radar-db-ci.yml"

permissions:
  contents: read

jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commitment_radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d commitment_radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: commitment_radar_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Supabase-compatible auth roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY,
            email text UNIQUE
          );
          CREATE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $function$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $function$;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;
          GRANT EXECUTE ON FUNCTION auth.uid() TO anon, authenticated, service_role;
          SQL

      - name: Apply reconstructed baseline
        run: psql -v ON_ERROR_STOP=1 -f commitment-radar/supabase/migrations/20261015112619_commitment_radar_initial_schema.sql

      - name: Apply backend hardening
        run: psql -v ON_ERROR_STOP=1 -f commitment-radar/supabase/migrations/20261015120014_commitment_radar_backend_hardening.sql

      - name: Verify schema and grants
        run: psql -v ON_ERROR_STOP=1 -f commitment-radar/supabase/tests/security_contract.sql

      - name: Verify tenant isolation, viewer write denial, and organization RPC
        run: psql -v ON_ERROR_STOP=1 -f commitment-radar/supabase/tests/rls_behavior.sql
