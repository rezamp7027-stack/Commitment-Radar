<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220"><title>You're offline · Commitment Radar</title>
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c2d;--line:#26364b;--text:#f1f5fb;--muted:#9aabc0;--teal:#62e0c5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 70% -15%,#193047 0,transparent 45%),var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}.panel{width:min(100%,560px);padding:32px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}.mark{color:var(--teal);font-size:12px;letter-spacing:.16em}h1{margin:.7rem 0;font-size:clamp(1.8rem,6vw,2.6rem)}p{color:var(--muted)}button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:var(--teal);color:#0b1220;font:inherit;font-weight:700;cursor:pointer}
</style></head>
<body><main class="panel"><div class="mark">COMMITMENT RADAR</div><h1>You're offline.</h1><p>The app needs a connection to securely load your workspace and sync commitments. Your private workspace data is not stored in this offline page.</p><p>Reconnect to the internet, then try again.</p><button type="button" onclick="location.reload()">Try again</button></main></body></html>
